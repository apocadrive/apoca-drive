<style>
:root{--night:#0E0D0B;--gold:#D9BE86;--paper:#F4EFE6;--display:"Cormorant Garamond",Georgia,serif;--body:"Jost",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font:300 17px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
.film{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;background:var(--night) center 30%/cover no-repeat;animation:kb 12s ease-out both}
.film[hidden]{display:none}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(14,13,11,.25) 0%,rgba(14,13,11,0) 18%,rgba(14,13,11,.35) 34%,rgba(14,13,11,.55) 48%,rgba(14,13,11,.6) 65%,rgba(14,13,11,.78) 100%)}
@keyframes kb{0%{opacity:0;transform:scale(1.06)}15%{opacity:1}100%{opacity:1;transform:scale(1.01)}}
.stage{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;animation:fade 1.6s ease both}
@keyframes fade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.film,main{animation:none}}
#head{display:flex;flex-direction:column;align-items:center;gap:12px}
#head .tag,#head .cdate,#head .live{margin:0}
.sym{width:40px;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.name{font:600 17px/1 var(--body);letter-spacing:.32em;padding-left:.32em}
.tag{margin:-6px 0 0;font:500 10px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:#EBD29C}
.live{display:inline-flex;align-items:center;gap:7px;margin:-2px 0 0;font:500 10px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:#F2C14E}
.live i{width:7px;height:7px;border-radius:50%;background:#F2C14E;box-shadow:0 0 0 4px rgba(242,193,78,.25)}
.couple{margin:0;font:400 40px/1.02 var(--display)}.couple em{color:#F6DFA8}
.cdate{margin:-4px 0 0;font:500 11px/1 var(--body);letter-spacing:.3em;text-transform:uppercase}
h1{margin:0 0 34px;font:500 26px/1.12 var(--display);text-wrap:balance}h1 em{color:#F6DFA8}
.name,.tag,h1,.couple,.cdate,.live{text-shadow:0 1px 2px rgba(0,0,0,.7),0 2px 14px rgba(0,0,0,.85),0 0 28px rgba(0,0,0,.6)}
.sound{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));border:1px solid rgba(255,255,255,.35);background:rgba(14,13,11,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;padding:10px 14px;border-radius:999px;font:500 12px/1 var(--body);cursor:pointer}
.list{width:100%;display:flex;flex-direction:column;gap:7px}
.b{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:40px;padding:10px 16px;border-radius:999px;color:var(--paper);text-decoration:none;font:400 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.35);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.b::before{content:"";position:absolute;inset:0 0 50% 0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.b:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.b svg{width:17px;height:17px;flex:none}
.b.main{background:linear-gradient(180deg,rgba(232,206,150,.62),rgba(217,190,134,.38));border-color:rgba(240,220,175,.7);color:#fff}
.b.wa{background:linear-gradient(180deg,rgba(60,230,120,.55),rgba(37,211,102,.32));border-color:rgba(120,240,160,.6);color:#fff}
.b.ig{background:linear-gradient(135deg,rgba(254,218,117,.38),rgba(250,126,30,.34) 30%,rgba(214,41,118,.42) 60%,rgba(150,47,191,.42) 85%,rgba(79,91,213,.4));border-color:rgba(255,190,220,.55)}
.b.tt{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),-2px 0 0 rgba(37,244,238,.55),2px 0 0 rgba(254,44,85,.55),0 8px 24px rgba(0,0,0,.25)}
.b.yt{background:linear-gradient(180deg,rgba(255,60,60,.5),rgba(220,0,0,.32));border-color:rgba(255,140,140,.55)}
.row{width:100%;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:7px}
.row .b{min-height:40px;padding:8px 6px;letter-spacing:.08em;font-size:10px;flex-direction:column;gap:6px;border-radius:20px}
.row[hidden]{display:none}
.b.press{transform:scale(.95,.92)}
.rip{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 52%,rgba(255,255,255,0) 60%,rgba(255,255,255,.25) 72%,rgba(255,255,255,0) 80%);animation:rip .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.b{transition:none}.b.press{transform:none}.rip{display:none}}
.foot{font-size:11px;letter-spacing:.14em;color:rgba(244,239,230,.6);margin:0}
#hapl{position:fixed;left:-9999px;top:0;opacity:0}
</style>
</head>
<body>
<video class="film" id="film" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
<div class="veil" aria-hidden="true"></div>
<button type="button" class="sound" id="sound" hidden>🔊 Activer le son</button>
<div class="stage"><main id="main">
  <img class="sym" src="logo-sym-w.png" alt="" width="217" height="240">
  <div id="head">
    <div class="name">APOCADRIVE</div>
    <p class="tag">Filmmaker · France · Monde</p>
  </div>
  <h1 id="h1">Vos plus beaux jours, <em>filmés comme au cinéma.</em></h1>
  <div class="list" id="list">
    <a class="b main" href="https://apocadrive.web.app/">Voir mon site</a>
    <a class="b wa" href="https://wa.me/33607055384?text=Bonjour%20Apoca%20Drive%2C%20je%20souhaite%20des%20informations%20pour%20mon%20projet." target="_blank" rel="noopener">WhatsApp direct</a>
    <a class="b" href="tel:+33607055384">Appeler</a>
    <a class="b" href="https://apocadrive.web.app/#reserver">Réserver ma date</a>
  </div>
  <div class="row" id="row">
    <a class="b ig" href="https://www.instagram.com/apocadrive/" target="_blank" rel="noopener">Instagram</a>
    <a class="b tt" href="https://www.tiktok.com/@apocadrive" target="_blank" rel="noopener">TikTok</a>
    <a class="b yt" href="https://www.youtube.com/@apocadrive" target="_blank" rel="noopener">YouTube</a>
  </div>
  <div class="list" id="list2"><a class="b" href="apoca-drive.vcf" download>Ajouter à mes contacts</a></div>
  <p class="foot">apocadrive.web.app</p>
</main></div>
<label id="hapl" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script>
(function(){
/* ---------- boutons ---------- */
var IC = {
  wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.5A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 1 1-4.2 15l-.3-.18-3.1.9.9-3-.2-.3A8.1 8.1 0 0 1 12.04 3.8z"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  resa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor"/></svg>',
  tt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.3 2.4 1.9 4 4.5 4.2"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
var DEF = [
  {k:"site", label:"Voir mon site", url:"https://apocadrive.web.app/", on:true},
  {k:"wa", label:"WhatsApp direct", url:"https://wa.me/33607055384?text=Bonjour%20Apoca%20Drive%2C%20je%20souhaite%20des%20informations%20pour%20mon%20projet.", on:true},
  {k:"tel", label:"Appeler", url:"tel:+33607055384", on:true},
  {k:"resa", label:"Réserver ma date", url:"https://apocadrive.web.app/#reserver", on:true},
  {k:"ig", label:"Instagram", url:"https://www.instagram.com/apocadrive/", on:true},
  {k:"tt", label:"TikTok", url:"https://www.tiktok.com/@apocadrive", on:true},
  {k:"yt", label:"YouTube", url:"https://www.youtube.com/@apocadrive", on:true},
  {k:"vcf", label:"Ajouter à mes contacts", url:"apoca-drive.vcf", on:true}
];
var SOC = {ig:1, tt:1, yt:1};
function E(x){ return String(x == null ? "" : x).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function okUrl(u){ return /^(https:\/\/|tel:|mailto:|sms:)/.test(u) || u === "apoca-drive.vcf"; }
function btn(x){
  var cls = "b" + (x.k === "site" ? " main" : x.k === "wa" ? " wa" : SOC[x.k] ? " " + x.k : "");
  var ext = /^https:\/\//.test(x.url) && x.k !== "site" && x.k !== "resa";
  var icon = IC[x.k] || (x.custom ? IC.link : "");
  return '<a class="' + cls + '" href="' + E(x.url) + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + (x.k === "vcf" ? " download" : "") + ">" + icon + E(x.label) + "</a>";
}
function renderButtons(list){
  var main = [], soc = [], last = [];
  list.forEach(function(x){ if (!x || x.on === false || !x.label || !okUrl(String(x.url || ""))) return; if (SOC[x.k]) soc.push(x); else if (x.k === "vcf") last.push(x); else main.push(x); });
  document.getElementById("list").innerHTML = main.map(btn).join("");
  var row = document.getElementById("row"); row.innerHTML = soc.map(btn).join(""); row.hidden = !soc.length; row.style.setProperty("--n", Math.max(1, soc.length));
  document.getElementById("list2").innerHTML = last.map(btn).join("");
}
function mergeButtons(cfg){
  if (!Array.isArray(cfg) || !cfg.length) return DEF;
  var byK = {}; DEF.forEach(function(d){ byK[d.k] = d; });
  var out = cfg.map(function(c){ var d = byK[c.k] || {}; return {k:c.k, custom:!!c.custom || !byK[c.k], label:c.label || d.label, url:c.url || d.url, on:c.on !== false}; });
  DEF.forEach(function(d){ if (!out.some(function(o){ return o.k === d.k; })) out.push(d); });
  return out;
}
renderButtons(DEF);

/* ---------- fond ---------- */
var film = document.getElementById("film");
var DEMO = [40627, 5223, 40584, 5224, 5218, 40596].map(function(id){ return "https://assets.mixkit.co/videos/" + id + "/" + id + "-720.mp4"; });
var demoI = 0, demoOn = false, noDemo = false;
function demo(){ demoOn = true; film.loop = false; film.src = DEMO[demoI++ % DEMO.length]; film.play().catch(function(){}); }
film.addEventListener("ended", function(){ if (demoOn) demo(); });
film.addEventListener("error", function(){ if (demoOn) setTimeout(demo, 300); });
function setVideo(url){ demoOn = false; film.loop = true; film.removeAttribute("poster"); film.src = url; film.hidden = false; film.play().catch(function(){}); }
function setPhoto(img){ demoOn = false; film.pause(); film.removeAttribute("src"); film.load(); film.style.backgroundImage = 'url("' + img.replace(/"/g, "") + '")'; }
window.__carte = {
  buttons: function(cfg){ renderButtons(mergeButtons(cfg)); },
  demo: demo, video: setVideo, photo: setPhoto, none: function(){ noDemo = true; },
  jour: function(j){
    if (!j) return;
    document.getElementById("head").innerHTML = '<p class="live"><i></i>Le film du jour</p>' + (j.titre ? '<p class="couple">' + E(j.titre).replace(/ (&amp;|et) /, ' <em>$1</em> ') + "</p>" : "") + (j.date ? '<p class="cdate">' + E(j.date) + "</p>" : "");
    document.getElementById("h1").innerHTML = j.phrase ? E(j.phrase) : 'Vos plus beaux jours, <em>filmés comme au cinéma.</em>';
    var s = document.getElementById("sound"); s.hidden = false;
    s.onclick = function(){ film.muted = !film.muted; s.textContent = film.muted ? "🔊 Activer le son" : "🔇 Couper le son"; film.play().catch(function(){}); };
  }
};

/* ---------- toucher : onde, rebond, petite vibration ---------- */
function buzz(){ try { if (navigator.vibrate){ navigator.vibrate(12); return; } } catch(e){} try { document.getElementById("hapl").click(); } catch(e){} }
document.addEventListener("pointerdown", function(e){
  var b = e.target.closest && e.target.closest(".b"); if (!b) return;
  buzz();
  var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.4, s = document.createElement("span");
  s.className = "rip"; s.style.width = s.style.height = d + "px"; s.style.left = (e.clientX - r.left) + "px"; s.style.top = (e.clientY - r.top) + "px";
  b.appendChild(s); setTimeout(function(){ s.remove(); }, 850); b.classList.add("press");
});
["pointerup","pointercancel","pointerout"].forEach(function(t){ document.addEventListener(t, function(e){ var b = e.target.closest && e.target.closest(".b"); if (b) b.classList.remove("press"); }); });
setTimeout(function(){ if (!noDemo && !film.src && !film.style.backgroundImage) demo(); }, 2500);
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const fs = getFirestore(initializeApp({ apiKey: "AIzaSyC9gZ9xNB3vYiYcOE9pIsgqINYTvT768lc", authDomain: "apoca-drive.firebaseapp.com", projectId: "apoca-drive", appId: "1:826000114685:web:4ed7cf006753e352a24f94", messagingSenderId: "826000114685" }));
const __day = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Paris" });
let __off = (location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || navigator.webdriver === true);
try { if (/[?&]nocount/.test(location.search)) localStorage.setItem("apoca_nostat", "1"); if (localStorage.getItem("apoca_nostat")) __off = true; } catch (e) {}
const __hit = (f) => { if (__off) return; setDoc(doc(fs, "stats", __day()), { [f]: increment(1) }, { merge: true }).catch(() => {}); };
try { if (!sessionStorage.getItem("apoca_c")) { sessionStorage.setItem("apoca_c", "1"); __hit("carte"); } } catch (e) { __hit("carte"); }
document.addEventListener("click", (e) => { const a = e.target.closest && e.target.closest("a"); if (!a) return; const h = a.getAttribute("href") || ""; if (/wa\.me/.test(h)) __hit("wa"); else if (h.indexOf("tel:") === 0) __hit("tel"); else if (a.hasAttribute("download")) __hit("contact"); }, true);

const C = window.__carte;
const chunks = async (col, field, val, n, type) => {
  const parts = (await getDocs(query(collection(fs, col), where(field, "==", val)))).docs.map((d) => d.data()).sort((a, b) => a.i - b.i);
  if (!parts.length || (n && parts.length !== n)) return "";
  return URL.createObjectURL(new Blob(parts.map((d) => d.b.toUint8Array()), { type: type || "video/mp4" }));
};
(async () => {
  let cfg = {};
  try { const s = await getDoc(doc(fs, "site/carte")); cfg = s.exists() ? s.data() : {}; } catch (e) {}
  if (cfg.buttons) C.buttons(cfg.buttons);
  const j = cfg.jour || {};
  if (j.on && j.vid && j.vid.n) {
    const u = await chunks("carteJour", "v", j.vid.v, j.vid.n, j.vid.type).catch(() => "");
    if (u) { C.jour(j); C.video(u); return; }
  }
  if (cfg.fond === "photo" && cfg.photo) { C.photo(cfg.photo); return; }
  if (cfg.fond === "aucun") { C.none(); return; }
  try {
    const m = (await getDoc(doc(fs, "site/heroVideoMeta"))).data();
    if (m && m.n) {
      const parts = (await getDocs(collection(fs, "heroVideo"))).docs.map((d) => d.data()).filter((d) => d.v === m.updated && d.i < m.n).sort((a, b) => a.i - b.i);
      if (parts.length === m.n) { C.video(URL.createObjectURL(new Blob(parts.map((d) => d.b.toUint8Array()), { type: m.type || "video/mp4" }))); return; }
    }
    const p = (await getDoc(doc(fs, "site/heroPhoto"))).data();
    if (p && p.img) { C.photo(p.img); return; }
  } catch (e) {}
  C.demo();
})();
</script>
