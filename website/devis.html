<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Votre devis · Apoca Drive</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF9F5;--card:#fff;--ink:#1E1B17;--ink-2:#4A453D;--mute:#8A8178;--line:#E6DFD3;--gold:#A9802F;--gold-2:#D9BE86;--ok:#2F7A4A;
  --f-display:"Cormorant Garamond",Georgia,serif;--f-body:"Jost",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:300 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding:max(20px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:center;padding:6px 0 26px}
.top img{height:30px;width:auto}
.card{background:var(--card);border:1px solid var(--line);padding:clamp(22px,5vw,46px)}
.eyebrow{margin:0;font:500 11px/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{font:400 clamp(34px,8vw,52px)/1.05 var(--f-display);margin:14px 0 6px}
h1 em{color:var(--gold)}
.meta{color:var(--mute);font-size:14px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lab{font:500 10px/1 var(--f-body);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.two b{font:500 20px/1.2 var(--f-display);display:block;margin-bottom:4px}
.small{font-size:14px;color:var(--ink-2)}
.obj{font:400 22px/1.3 var(--f-display);margin:0 0 22px}
.lines{display:flex;flex-direction:column}
.ln{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.ln span{white-space:pre-wrap}
.ln small{display:block;color:var(--mute);font-size:13px}
.ln b{font-weight:400;white-space:nowrap}
.tot{margin-top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tot div{display:flex;gap:24px;justify-content:space-between;min-width:min(320px,100%);font-size:15px;color:var(--ink-2)}
.tot .g{margin-top:8px;padding-top:12px;border-top:1px solid var(--ink);color:var(--ink)}
.tot .g b{font:500 32px/1 var(--f-display)}
.tot .g span{align-self:flex-end;font:500 11px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase}
.notes{margin-top:30px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.notes em{color:var(--mute)}
.acts{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 20px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:400 13px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ink)}
.btn.wa{background:#25D366;border-color:#25D366}
.btn[disabled]{opacity:.6}
.okbox{margin-top:30px;padding:20px;border:1px solid #BFD9C6;background:#F2F8F3;color:var(--ok);text-align:center;font:400 22px/1.3 var(--f-display)}
.okbox small{display:block;font:300 14px/1.5 var(--f-body);color:var(--ink-2);margin-top:6px}
.confirm{display:none;padding:16px;border:1px solid var(--gold-2);background:#FBF7EF;font-size:15px}
.confirm.on{display:block}
.state{text-align:center;padding:80px 10px;color:var(--mute)}
.foot{text-align:center;margin-top:22px;font:400 11px/1.6 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
@media (max-width:560px){.two{grid-template-columns:1fr}}
@media print{body{background:#fff;padding:0}.top,.acts,.foot,.confirm{display:none!important}.card{border:0;padding:0}}
</style>
</head>
<body>
<main>
  <div class="top"><img src="logo-name-k.png" alt="Apoca Drive"></div>
  <div id="root"><div class="state">Chargement de votre devis…</div></div>
  <p class="foot">Apoca Drive · Filmmaker · France</p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyC9gZ9xNB3vYiYcOE9pIsgqINYTvT768lc", authDomain: "apoca-drive.firebaseapp.com", projectId: "apoca-drive", appId: "1:826000114685:web:4ed7cf006753e352a24f94", messagingSenderId: "826000114685" });
const fs = getFirestore(app);
const root = document.getElementById("root");
const E = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token = new URLSearchParams(location.search).get("d") || "";
const fail = m => { root.innerHTML = `<div class="state">${m}</div>`; };
let D = null, accepted = false;

function money(n){ try { return new Intl.NumberFormat("fr-FR", {style:"currency", currency:(D && D.currency) || "EUR", maximumFractionDigits:2, minimumFractionDigits:0}).format(+n || 0); } catch(e){ return (+n || 0) + " €"; } }
const frDate = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return ""; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); };
const addDays = (s, n) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return ""; const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + (+n || 0)); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
const waNum = t => { let x = String(t || "").replace(/[^\d+]/g, "").replace(/^\+/, ""); if (x.startsWith("00")) x = x.slice(2); if (x.startsWith("0")) x = "33" + x.slice(1); return x; };

function render(){
  const d = D, co = d.co || {}, c = d.client || {}, t = d.totals || {};
  const until = d.validity ? addDays(d.date, d.validity) : "";
  const wa = waNum(co.phone || "33607055384");
  root.innerHTML = `<article class="card">
    <p class="eyebrow">Devis · ${E(co.name || "Apoca Drive")}</p>
    <h1>Votre devis <em>${E(d.num || "")}</em></h1>
    <p class="meta">Émis le ${E(frDate(d.date))}${until ? ` · valable jusqu'au ${E(frDate(until))}` : ""}</p>
    <div class="two">
      <div><div class="lab">Pour</div><b>${E(c.name || "")}</b><div class="small">${[c.address, c.phone, c.email].filter(Boolean).map(E).join("<br>")}</div></div>
      <div><div class="lab">De</div><b>${E(co.name || "Apoca Drive")}</b><div class="small">${[co.activity, co.address, co.phone, co.email, co.siret ? "SIRET " + co.siret : ""].filter(Boolean).map(E).join("<br>")}</div></div>
    </div>
    ${d.object ? `<p class="obj">${E(d.object)}</p>` : ""}
    <div class="lines">${(d.lines || []).map(l => `<div class="ln"><span>${E(l.desc)}${+l.qty > 1 ? `<small>${E(l.qty)} × ${E(money(l.unit))}</small>` : ""}</span><b>${E(money((+l.qty || 1) * (+l.unit || 0)))}</b></div>`).join("")}</div>
    <div class="tot">
      ${t.disc ? `<div><span>Sous-total</span><span>${E(money(t.sub))}</span></div><div><span>Remise ${E(d.discount)} %</span><span>− ${E(money(t.disc))}</span></div>` : ""}
      ${+d.tva ? `<div><span>Total HT</span><span>${E(money(t.ht))}</span></div><div><span>TVA ${E(d.tva)} %</span><span>${E(money(t.tva))}</span></div>` : ""}
      <div class="g"><span>${+d.tva ? "Total TTC" : "Total"}</span><b>${E(money(t.ttc))}</b></div>
      ${+d.deposit ? `<div><span>Acompte à la réservation (${E(d.deposit)} %)</span><span>${E(money(t.dep))}</span></div>` : ""}
    </div>
    ${d.notes || d.mention || co.iban ? `<div class="notes">${E(d.notes || "")}${d.mention ? `\n<em>${E(d.mention)}</em>` : ""}${co.iban ? `\n\nRèglement par virement · IBAN : ${E(co.iban)}` : ""}</div>` : ""}
    ${accepted ? `<div class="okbox">Devis accepté. Merci !<small>${E(co.name || "Apoca Drive")} a été prévenu et revient vers vous très vite pour la suite.</small></div>` : `
    <div class="acts">
      <button class="btn" id="acc">J'accepte ce devis</button>
      <div class="confirm" id="conf">En confirmant, vous acceptez ce devis et ses conditions. ${E(co.name || "Apoca Drive")} sera prévenu tout de suite.
        <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="yes">Je confirme</button><button class="btn line" id="no">Annuler</button></div></div>
    </div>`}
    <div class="acts">
      <a class="btn wa" href="https://wa.me/${wa}?text=${encodeURIComponent(`Bonjour, j'ai une question sur le devis ${d.num || ""}.`)}" target="_blank" rel="noopener">Une question ? WhatsApp</a>
      <button class="btn line" id="pr">Télécharger / imprimer</button>
    </div>
  </article>`;
  const $ = id => document.getElementById(id);
  $("pr").onclick = () => window.print();
  if (!accepted){
    $("acc").onclick = () => { $("conf").classList.add("on"); $("acc").style.display = "none"; };
    $("no").onclick = () => { $("conf").classList.remove("on"); $("acc").style.display = ""; };
    $("yes").onclick = async () => {
      const b = $("yes"); b.disabled = true; b.textContent = "Envoi…";
      try { await setDoc(doc(fs, "devisReponses", token), { ok: true, at: serverTimestamp() }); accepted = true; render(); }
      catch(e){ if (e && e.code === "permission-denied"){ accepted = true; render(); return; } b.disabled = false; b.textContent = "Je confirme"; alert("La réponse n'est pas partie. Vérifiez votre connexion et réessayez."); }
    };
  }
}

(async () => {
  if (!/^[a-f0-9]{20,64}$/.test(token)) return fail("Ce lien de devis n'est pas valide.");
  try {
    const s = await getDoc(doc(fs, "devis", token));
    if (!s.exists()) return fail("Ce devis n'existe plus. Contactez Apoca Drive au +33 6 07 05 53 84.");
    D = s.data(); accepted = !!D.accepted; document.title = `Devis ${D.num || ""} · ${(D.co && D.co.name) || "Apoca Drive"}`; render();
  } catch(e){ fail("Le devis n'a pas pu s'afficher. Vérifiez votre connexion et rechargez la page."); }
})();
</script>
</body>
</html>
