<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="/manifest.json">

</head><body>
<title>Apoca Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — slate header, scrolling view, fixed bottom tab bar. Colour story: tungsten (3200K) accent vs daylight (5600K) blue. */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#15191e; --muted:#5b6570; --line:#d3d9df;
  --tungsten:#b8650a; --tungsten-soft:#f6e3c8; --daylight:#2a69a8; --daylight-soft:#dbe8f5;
  --ok:#23804f; --ok-soft:#d8efe2; --rec:#c42b2b; --rec-soft:#f7dcdc; --warn:#9a6a00;
  --slate:#15191e; --slate-ink:#f4f6f8;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101316; --surface:#191d22; --surface-2:#20252b; --ink:#e8ecef; --muted:#97a1ac; --line:#2c333b;
  --tungsten:#f0a047; --tungsten-soft:#3a2a14; --daylight:#6da8e8; --daylight-soft:#17283a;
  --ok:#5cc58c; --ok-soft:#15301f; --rec:#ff6d6d; --rec-soft:#3a1a1a; --warn:#e2b443;
  --slate:#05070a; --slate-ink:#f4f6f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#191d22; --surface-2:#20252b; --ink:#e8ecef; --muted:#97a1ac; --line:#2c333b;
  --tungsten:#f0a047; --tungsten-soft:#3a2a14; --daylight:#6da8e8; --daylight-soft:#17283a;
  --ok:#5cc58c; --ok-soft:#15301f; --rec:#ff6d6d; --rec-soft:#3a1a1a; --warn:#e2b443;
  --slate:#05070a; --slate-ink:#f4f6f8; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--slate)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Slate header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--slate);color:var(--slate-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.stripes{height:7px;background:repeating-linear-gradient(-45deg,var(--slate-ink) 0 10px,var(--slate) 10px 20px);opacity:.9}
.brand{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.brand b{color:var(--tungsten);font-weight:900}
.top .sub{font-family:var(--f-mono);font-size:11px;opacity:.7;letter-spacing:.06em;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.back{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:var(--slate-ink);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.back svg{width:22px;height:22px}
.back:active{background:rgba(255,255,255,.2)}
.top h1{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}

/* Bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--tungsten)}

/* Generic */
h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
a.btn{text-decoration:none;color:inherit}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dcard{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#14120f;padding:0;display:block;text-align:left;color:#fff}
.dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dcard .dph{position:absolute;inset:0;display:grid;place-items:center;font-size:42px}
.dcard .dcap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));display:flex;flex-direction:column;gap:2px}
.dcard .dcap b{font-size:18px}
.dcard .dcap small{font-size:11px;opacity:.85}
.dcard .dhid{position:absolute;top:8px;left:8px}
.dphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.dpi{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.dpi img{width:100%;height:100%;object-fit:cover;display:block}
.dpi .dx{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;padding:0}
.dpi .dcovb{position:absolute;left:4px;bottom:4px;border:0;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:4px 8px}
.dpi .dcov{position:absolute;left:4px;bottom:4px;font-size:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--tungsten);border-color:var(--tungsten);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a1206}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a1206}}
.btn.day{background:var(--daylight-soft);border-color:transparent;color:var(--daylight)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--rec);border-color:var(--rec-soft);background:var(--rec-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.tu{background:var(--tungsten-soft);color:var(--tungsten)}
.pill.da{background:var(--daylight-soft);color:var(--daylight)}
.pill.rec{background:var(--rec-soft);color:var(--rec)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;font-weight:400;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* iPhone : sous 16px, Safari zoome sur le champ touché et la page déborde à droite */
@media (hover:none),(max-width:900px){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
html,body{max-width:100%;overflow-x:clip}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Hero (next shoot) */
.hero{background:var(--slate);color:var(--slate-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left;width:100%}
.hero .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tungsten)}
.hero .count{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.hero .count small{font-size:20px;font-weight:800;margin-left:6px}
.hero .t{font-size:18px;font-weight:600;line-height:1.25}
.hero .meta{font-size:13px;opacity:.75}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero .chips span{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border:1px solid rgba(255,255,255,.22);border-radius:6px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--tungsten) 0,transparent 70%);opacity:.35;pointer-events:none}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:9px;background:none;font-family:var(--f-mono);font-size:13px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cal button.out{color:var(--muted);opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--daylight)}
.cal button.has{background:var(--tungsten-soft);color:var(--tungsten);font-weight:700}
.cal button.has::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--tungsten)}
.cal button:hover{background:var(--surface-2)}

/* Shoot list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.item .d{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.item .d b{display:block;font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.item .d span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--muted)}
.item .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.item.past{opacity:.65}

/* Segmented tabs */
.seg{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:0;background:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--slate);color:var(--slate-ink)}
.seg.two{display:grid;grid-template-columns:1fr 1fr;position:static}
.seg.two button{padding:8px 4px;white-space:normal}

/* Gear */
.gcat{display:flex;flex-direction:column;gap:2px}
.gcat h3{margin:6px 0 4px}
.gi{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:9px}
.gi:hover{background:var(--surface-2)}
.gi input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.gi .n{flex:1;min-width:0}
.gi.on .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--rec);background:var(--rec-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--tungsten)}
.chip.tu{background:var(--tungsten-soft);border-color:transparent;color:var(--tungsten);font-weight:600}

/* Palettes */
.pals{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pal{flex:none;width:112px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:5px;text-align:left}
.pal[aria-pressed="true"]{border-color:var(--tungsten);box-shadow:0 0 0 2px var(--tungsten-soft)}
.pal .sw{display:flex;height:26px;border-radius:5px;overflow:hidden}
.pal .sw i{flex:1}
.pal span{font-size:12px;font-weight:600;line-height:1.2}
.swatch{display:inline-flex;height:12px;width:56px;border-radius:3px;overflow:hidden;vertical-align:middle}
.swatch i{flex:1}

/* Storyboard */
.frame{display:block;width:100%;height:auto;border-radius:6px;background:#000;max-height:520px}
.plan{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.plan{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.plan .fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.plan .head{display:flex;align-items:center;gap:8px}
.plan .num{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1}
.plan.done .frame{opacity:.55}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.board figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.board figcaption{font-size:12px;line-height:1.3}
.board figcaption b{font-family:var(--f-mono);font-size:11px;color:var(--tungsten)}
.sugg{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.sugg:first-of-type{border-top:0}
.sugg .txt{flex:1;min-width:0;font-size:14px}
.sugg .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.note{font-size:13px;padding:10px 12px;border-radius:9px;background:var(--daylight-soft);color:var(--ink)}
.note.warn{background:var(--tungsten-soft)}

/* Sun bar */
.sun{position:relative;height:30px;border-radius:7px;overflow:hidden;background:#1d2533;border:1px solid var(--line)}
.sun i{position:absolute;top:0;bottom:0}
.sun .lbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.times div{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.times div b{display:block;font-family:var(--f-mono);font-size:17px}
.times div span{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--rec-soft);padding:10px;border-radius:10px}
.money{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.money.rec{color:var(--rec)} .money.ok{color:var(--ok)}
.pay{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pay b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pay small{display:block;color:var(--muted);font-size:12px}
.cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cli>button{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.cli .nm{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli .sm{font-size:13px;color:var(--muted)}
.cli .body{border-top:1px solid var(--line);padding:6px 14px 12px;display:flex;flex-direction:column;gap:2px}
.cli .sh{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.cli .sh:last-child{border-bottom:0}
/* Welcome screen */
.home{position:relative;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--slate);color:#f4f6f8;isolation:isolate}
.home .hbg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;z-index:-2}
.home .hfall{position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 78% 22%,#c97a22 0,transparent 42%),radial-gradient(circle at 15% 80%,#244e7a 0,transparent 50%),#0b0d10}
.home::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,7,10,.55) 0,rgba(5,7,10,0) 26%,rgba(5,7,10,.15) 50%,rgba(5,7,10,.88) 100%)}
.home .hin{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 28px;display:flex;flex-direction:column;gap:16px;max-width:720px;width:100%;margin:0 auto}
.home .htop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:16px}
.home .htop .stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.home .hdots{padding:0;width:48px;height:44px;justify-content:center;flex:none}
.home .htop .row{flex-wrap:nowrap}
.home .glass{background:rgba(15,18,22,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);color:#f4f6f8;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

.home .glass.wedb{position:relative;overflow:hidden;justify-content:flex-start;gap:12px;padding:12px 14px;text-align:left;border-color:rgba(236,201,75,.3)}
.wed-r{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(236,201,75,.14);border:1px solid rgba(236,201,75,.4)}
.wedb.in{animation:rdvIn .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*90ms + .1s)}

/* ---------- Sun (golden / blue hour) ---------- */
function sunEvents(dateStr, lat, lon){
  const [y,m,d] = dateStr.split("-").map(Number);
  const rad = Math.PI/180;
  const jd0 = Date.UTC(y,m-1,d)/86400000 + 2440587.5;
  const n = Math.round(jd0 - 2451545 + 0.0008);
  const Js = n - lon/360;
  const M = (357.5291 + 0.98560028*Js) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  const dec = Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const toDate = J => new Date((J - 2440587.5)*86400000);
  const at = h => {
    const cw = (Math.sin(h*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
    if (cw < -1 || cw > 1) return null;
    const w = Math.acos(cw)/rad;
    return [toDate(Jt - w/360), toDate(Jt + w/360)];
  };
  return {noon:toDate(Jt), b6:at(-6), b4:at(-4), rise:at(-0.833), g6:at(6)};
}
const fmtT = (dt, tz) => dt ? new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(dt) : "—";
const localH = (dt, tz) => { const p = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:tz}).formatToParts(dt); const g = t => +p.find(x=>x.type===t).value; return g("hour") + g("minute")/60; };
function sunBlock(dateStr, cityName){
  const c = cityOf(cityName);
  if (!c || !dateStr) return `<p class="muted small">Choisissez une ville et une date pour voir l'heure dorée.</p>`;
  const e = sunEvents(dateStr, c[1], c[2]); const tz = c[3];
  if (!e.rise) return `<p class="muted small">Pas de lever ni de coucher de soleil ce jour-là.</p>`;
  const H = dt => localH(dt, tz)/24*100;
  const band = (a,b,col) => a && b ? `<i style="left:${H(a)}%;width:${Math.max(0,H(b)-H(a))}%;background:${col}"></i>` : "";
  const blueM = e.b6 && e.b4 ? [e.b6[0], e.b4[0]] : null, goldM = e.b4 && e.g6 ? [e.b4[0], e.g6[0]] : null;
  const goldE = e.g6 && e.b4 ? [e.g6[1], e.b4[1]] : null, blueE = e.b4 && e.b6 ? [e.b4[1], e.b6[1]] : null;
  const day = e.g6 ? [e.g6[0], e.g6[1]] : [e.rise[0], e.rise[1]];
  return `
  <div class="sun" role="img" aria-label="Lumière de la journée">
    ${band(day[0],day[1],"#bcd6ee")}${goldM?band(goldM[0],goldM[1],"#e9a24a"):""}${goldE?band(goldE[0],goldE[1],"#e9a24a"):""}${blueM?band(blueM[0],blueM[1],"#3d6fb5"):""}${blueE?band(blueE[0],blueE[1],"#3d6fb5"):""}
  </div>
  <div class="sun lbl" style="height:auto;background:none;border:0"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>
  <div class="times">
    <div><span>Lever du soleil</span><b>${fmtT(e.rise[0],tz)}</b></div>
    <div><span>Coucher du soleil</span><b>${fmtT(e.rise[1],tz)}</b></div>
    <div><span>Heure dorée du matin</span><b>${goldM?fmtT(goldM[0],tz)+"–"+fmtT(goldM[1],tz):"—"}</b></div>
    <div><span>Heure dorée du soir</span><b>${goldE?fmtT(goldE[0],tz)+"–"+fmtT(goldE[1],tz):"—"}</b></div>
    <div><span>Heure bleue du matin</span><b>${blueM?fmtT(blueM[0],tz)+"–"+fmtT(blueM[1],tz):"—"}</b></div>
    <div><span>Heure bleue du soir</span><b>${blueE?fmtT(blueE[0],tz)+"–"+fmtT(blueE[1],tz):"—"}</b></div>
  </div>
  <p class="muted small">Heures locales de ${esc(c[0])}, calculées à quelques minutes près.</p>`;
}

function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
async function imgToData(url){
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext("2d").drawImage(img, 0, 0);
  return {data:c.toDataURL("image/png"), w:img.naturalWidth, h:img.naturalHeight};
}

  if (y + 30 > 280){ doc.addPage(); y = 20; }

  return doc.output("blob");
}
async function downloadPDF(q){
  if (!S.downloads){ toast("Le téléchargement n'est pas disponible ici. Ouvrez Apoca Drive depuis l'application Claude ou claude.ai."); return; }
  ui.pdfBusy = true; render();
  try {
    const blob = await buildPDF(q);
    const name = `${isInv(q)?"Facture":"Devis"} ${q.num}${q.client&&q.client.name?" - "+q.client.name:""}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
    await S.downloads.save({filename:name, data:blob});
    if (!isInv(q) && q.status === "Brouillon"){ q.status = "Envoyé"; touchQ(ui.qid); }
    toast(isInv(q) ? "Facture téléchargée" : "Devis téléchargé");
  } catch(e){
    const code = e && e.code;
    toast(code === "declined" ? "Téléchargement annulé" : code === "rate_limited" ? "Une fenêtre de téléchargement est déjà ouverte" : "Le PDF n'a pas pu être créé. Vérifiez votre connexion et réessayez.");
  }
  ui.pdfBusy = false; render();
}

/* ---------- Statistiques ---------- */
function shortMoney(n){ const a = Math.abs(n); if (a >= 1e6) return (n/1e6).toFixed(1).replace(".",",")+" M"; if (a >= 1000) return (n/1000).toFixed(a>=1e4?0:1).replace(".",",")+" k"; return String(Math.round(n)); }
function viewStats(){
  if (!S.ready) return `<div class="empty"><span class="spin"></span>Chargement…</div>`;
  const Y = ui.statsYear || new Date().getFullYear(); const all = sorted();
  const inYear = all.filter(s => (s.date||"").startsWith(Y+"-"));
  const months = Array(12).fill(0); let cashed = 0;
  all.forEach(s => (s.payments||[]).forEach(p => { if ((p.date||"").startsWith(Y+"-")){ const m = +p.date.slice(5,7)-1; months[m] += +p.amount||0; cashed += +p.amount||0; } }));
  const billed = inYear.reduce((a,s)=>a+(+s.price||0),0); const priced = inYear.filter(s=>+s.price>0);
  const avg = priced.length ? billed/priced.length : 0;
  const crewCost = inYear.reduce((a,s)=>a+(s.crew||[]).reduce((b,c)=>b+(+c.fee||0),0),0);
  const toCash = all.reduce((a,s)=>a+Math.max(0,restOf(s)),0);
  const byCat = {}; inYear.forEach(s => { const k = s.category||"autre"; byCat[k] = (byCat[k]||0) + (+s.price||0); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const catMax = Math.max(1, ...cats.map(c=>c[1]));
  const cnt = {}; inYear.forEach(s => { const k = s.category||"autre"; cnt[k] = (cnt[k]||0)+1; });
  // chart
  const W = 340, H = 170, L = 34, B = 20, T = 14; const max = Math.max(...months, 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max/step)*step; const cw = (W-L-6)/12;
  const yv = v => T + (H-T-B) * (1 - v/nice);
  let grid = ""; for (let i=0;i<=4;i++){ const v = nice*i/4; grid += `<line class="gl" x1="${L}" x2="${W-4}" y1="${yv(v)}" y2="${yv(v)}"/><text x="${L-4}" y="${yv(v)+3}" text-anchor="end">${shortMoney(v)}</text>`; }
  const curM = new Date().getFullYear() === Y ? new Date().getMonth() : -1;
  const bars = months.map((v,i) => { const x = L + i*cw + cw*.18, w = cw*.64, y = yv(v); return `<rect class="b${i===curM?" now":""}" x="${x}" y="${y}" width="${w}" height="${Math.max(0,H-B-y)}" rx="2"><title>${MONTHS[i]} : ${money(v)}</title></rect><text x="${x+w/2}" y="${H-6}" text-anchor="middle">${"JFMAMJJASOND"[i]}</text>`; }).join("");
  const years = [Y-1, Y, Y+1].filter(y => y <= new Date().getFullYear()+1);
  let h = `<div class="row between"><h2>Statistiques</h2><div class="chips">${years.map(y=>`<button class="chip${y===Y?" tu":""}" data-act="syear" data-v="${y}">${y}</button>`).join("")}</div></div>
  <section class="panel"><h3>Encaissé en ${Y}</h3><span class="money ok">${esc(money(cashed))}</span>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Montants encaissés par mois en ${Y}">${grid}${bars}</svg>
    <p class="small muted" style="margin:0">Chaque barre = l'argent reçu ce mois-là (paiements notés dans vos tournages).${curM>=0?" Le mois en cours est en bleu.":""}</p></section>
  <div class="times"><div><span>Tournages en ${Y}</span><b>${inYear.length}</b></div><div><span>Chiffre d'affaires prévu</span><b>${esc(money(billed))}</b></div><div><span>Prix moyen d'un tournage</span><b>${esc(money(avg))}</b></div><div><span>Reste à encaisser (tout)</span><b>${esc(money(toCash))}</b></div>${crewCost?`<div><span>Coût de l'équipe</span><b>${esc(money(crewCost))}</b></div><div><span>Ce qu'il vous reste</span><b>${esc(money(billed-crewCost))}</b></div>`:""}</div>`;
  h += `<section class="panel"><h3>Ce qui vous rapporte le plus en ${Y}</h3>${cats.length && billed ? cats.map(([k,v]) => `<div class="hbar"><span>${esc(catLabel(k))} <span class="muted">(${cnt[k]})</span></span><span class="tr"><i style="width:${Math.round(v/catMax*100)}%"></i></span><b>${esc(money(v))}</b></div>`).join("") : `<p class="small muted" style="margin:0">Indiquez un prix et un type de projet sur vos tournages pour voir cette répartition.</p>`}</section>`;
  return h;
}

async function buildContractPDF(s){

  let y = 52;
  const block = (x, title, lines) => { doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...BRN); doc.text(title.toUpperCase(), x, y); let yy = y + 5; lines.forEach((ln, i) => { if (!ln) return; doc.setFont("helvetica", i===0?"bold":"normal"); doc.setFontSize(i===0?11:9.5); doc.setTextColor(...(i===0?INK:[60,60,68])); doc.splitTextToSize(ln, 82).forEach(part => { doc.text(part, x, yy); yy += i===0?5.5:4.5; }); }); return yy; };
  const y1 = block(M, "Le prestataire", [co.name, ...(co.address||"").split("\n"), co.phone, co.email, co.siret?"SIRET : "+co.siret:""]);
  const y2 = block(110, "Le client", [s.client||"—", ...(c.clientAddress||"").split("\n"), s.contact]);

    const tl = doc.splitTextToSize((x || "").replace(/[\u202f\u00a0]/g, " "), W-2*M);

    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...BRN); doc.text(`ARTICLE ${i+1}  ·  ${t.toUpperCase()}`, M, y);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(tl, M, y+5); y += 5 + tl.length*4.4 + 5;
  });
  if (y + 40 > 280){ doc.addPage(); y = 20; }
  y += 2; doc.setDrawColor(185,185,194); doc.setLineDashPattern([1.5,1.5],0);
  const bw = (W-2*M-8)/2; doc.roundedRect(M, y, bw, 34, 2, 2); doc.roundedRect(M+bw+8, y, bw, 34, 2, 2); doc.setLineDashPattern([],0);
  doc.setFontSize(9); doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.text("Le prestataire", M+3, y+6); doc.text("Le client", M+bw+11, y+6);
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUTE); doc.text("« Lu et approuvé », date et signature", M+3, y+11); doc.text("« Lu et approuvé », date et signature", M+bw+11, y+11);

  return doc.output("blob");
}

function stripOf(s){

function sbMove(s, id, zone, i){

/* Allège une vidéo sur le téléphone avant l'envoi : réencodage en MP4 (H.264), 1080 px de large maximum, sans le son. */
async function shrinkVideo(file, onProg){
  const MR = window.MediaRecorder; if (!MR || !HTMLCanvasElement.prototype.captureStream) return file;
  const mime = ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1.4d0028", "video/mp4;codecs=avc1", "video/mp4"].find(t => { try { return MR.isTypeSupported(t); } catch(e){ return false; } });
  if (!mime) return file;
  const url = URL.createObjectURL(file), v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = url;
  v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"; document.body.appendChild(v);
  const cleanup = () => { try { v.pause(); } catch(e){} v.remove(); URL.revokeObjectURL(url); };
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = rej; setTimeout(() => rej(new Error("meta")), 15000); });
    const sc = Math.min(1, 1080 / Math.max(1, Math.min(v.videoWidth, v.videoHeight)));
    const W = Math.round(v.videoWidth * sc / 2) * 2, H = Math.round(v.videoHeight * sc / 2) * 2;
    const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
    const stream = c.captureStream(30), rec = new MR(stream, {mimeType: mime, videoBitsPerSecond: 3000000}), parts = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    const done = new Promise(r => { rec.onstop = r; });
    let on = true; const draw = () => { if (!on) return; g.drawImage(v, 0, 0, W, H); onProg && v.duration && onProg(Math.min(1, v.currentTime / v.duration));
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); };
    g.drawImage(v, 0, 0, W, H); rec.start(1000); await v.play(); draw();
    await new Promise(r => { v.onended = r; setTimeout(r, (v.duration + 20) * 1000); });
    on = false; rec.stop(); await done; stream.getTracks().forEach(t => t.stop()); cleanup();
    const out = new File(parts, (file.name || "video").replace(/\.[^.]+$/, "") + "-web.mp4", {type: "video/mp4"});
    return out.size > 200000 && out.size < file.size * 0.85 ? out : file;
  } catch(e){ cleanup(); return file; }
}
async function siteHeroVideo(file){
  if (!/^video\//.test(file.type || "video/")) return toast("Choisissez un fichier vidéo.");
  if (file.size > 120 * 1048576) return toast(`Vidéo trop lourde (${Math.round(file.size/1048576)} Mo). Choisissez une vidéo plus courte (10 à 30 secondes).`);
  const poster = await videoPoster(file).catch(() => "");
  if (file.size > 6 * 1048576){ ui.heroVidMsg = "Allègement de la vidéo"; ui.heroVidUp = 0; render();
    const before = file.size; file = await shrinkVideo(file, p => { ui.heroVidUp = p; if (ui.view === "site") softRender(); });
    if (file.size < before) toast(`Vidéo allégée : ${(before/1048576).toFixed(0)} Mo → ${(file.size/1048576).toFixed(1).replace(".", ",")} Mo`); }
  if (file.size > 40 * 1048576){ ui.heroVidUp = null; ui.heroVidMsg = ""; render(); return toast(`Vidéo encore trop lourde (${Math.round(file.size/1048576)} Mo). Choisissez une vidéo plus courte.`); }
  ui.heroVidMsg = "Envoi de la vidéo"; ui.heroVidUp = 0; render();
  try { await window.__apocaSiteAdmin.setHeroVideo(file, p => { ui.heroVidUp = p; if (ui.view === "site") softRender(); }, poster); toast("Vidéo en ligne · visible sur le site"); }
  catch(e){ toast("La vidéo n'a pas pu être envoyée. Vérifiez la connexion et réessayez."); }
  ui.heroVidUp = null; ui.heroVidMsg = ""; render();
}

  let h = `<div class="row between"><h2>Ma bibliothèque</h2><span class="mono small muted">${S.kit.items.length} éléments</span></div>`;
  h += `<section class="panel"><h3>Ajouter du matériel</h3><div class="grid2"><input type="text" id="k-name" placeholder="Ex. : Sony FX3"><select id="k-cat">${opts(CATS.map(c=>[c,c]),"Boîtiers")}</select></div><button class="btn primary" data-act="kadd" style="align-self:flex-start">Ajouter</button></section>`;
  if (!S.kit.items.length) h += `<div class="empty"><strong style="color:var(--ink)">Votre bibliothèque est vide</strong>Notez ici tout votre matériel une fois pour toutes. Ensuite, vous l'ajouterez à chaque tournage en un geste.<button class="btn day" data-act="kstarter">Partir d'une liste type</button></div>`;
  else {
    h += `<section class="panel">`;
    for (const cat of CATS){ const items = S.kit.items.filter(k=>k.cat===cat); if (!items.length) continue;
      h += `<div class="gcat"><h3>${esc(cat)}</h3>${items.map(k=>`<div class="gi"><span class="n">${esc(k.name)}</span><button class="x" data-act="kdel" data-kid="${k.id}" aria-label="Supprimer ${esc(k.name)}">×</button></div>`).join("")}</div>`; }
    h += `</section>`;
  }
  return h;
}

/* ---------- Events ---------- */
let toastT;
function toast(msg){ let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ el.hidden = true; }, 2600); }

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act; const s = cur();
  if (b.type === "checkbox"){ return; }
  if (siteClick(a, b)) return;
  switch(a){
    case "nav": if (b.dataset.v === ui.view) break; pushHist(); ui.view = b.dataset.v; ui.homeEdit = false; ui.plus = null; render(true); break;
    case "back": goBack(); break;
    case "open": openShoot(b.dataset.id); break;
    case "sdopen": openShoot(b.dataset.id, "days"); break;
    case "new": newShoot(); break;
    case "day": { const ex = sorted().filter(x=>x.date===b.dataset.d); if (ex.length) openShoot(ex[0].id); else { ui.wedForm = {type: "Mariage civil", date: b.dataset.d, time: "14:00"}; pushHist(); ui.view = "wed"; render(true); } break; }
    case "mon": { const d = +b.dataset.d; if (!d){ ui.month = null; } else { const base = ui.month ? parseD(ui.month+"-01") : new Date(); const n = new Date(base.getFullYear(), base.getMonth()+d, 1); ui.month = `${n.getFullYear()}-${pad(n.getMonth()+1)}`; } render(); break; }
    case "past": ui.showPast = !ui.showPast; render(); break;
    case "example": { const ex = JSON.parse($("#example").textContent); const id = "exemple-" + uid(); S.shoots[id] = ex; touch(id); openShoot(id, "plans"); break; }
    case "tab": ui.tab = b.dataset.v; ui.confirmDel = false; ui.lightbox = null; ui.sbSel = null; ui.sbForm = null; render(); break;
    case "del": ui.confirmDel = true; render(); break;
    case "del-no": ui.confirmDel = false; render(); break;
    case "del-yes": { const id = ui.id; ui.view = "agenda"; ui.id = null; await removeShoot(id); render(true); toast("Tournage supprimé"); break; }
    case "gmode": ui.gearMode = b.dataset.v; render(); break;
    case "gdel": e.preventDefault(); s.gear = s.gear.filter(x=>x.id!==b.dataset.gid); touch(ui.id); render(); break;
    case "gadd": { const n = $("#g-name").value, c = $("#g-cat").value; if (addGear(s,n,c)){ touch(ui.id); render(); setTimeout(()=>$("#g-name")&&$("#g-name").focus(),0); } else toast(n.trim()?"Déjà dans le sac":"Écrivez le nom du matériel"); break; }
    case "gfromlib": { const k = S.kit.items.find(x=>x.id===b.dataset.kid); if (k && addGear(s,k.name,k.cat)){ touch(ui.id); render(); } break; }
    case "gall": { S.kit.items.forEach(k=>addGear(s,k.name,k.cat)); touch(ui.id); render(); break; }
    case "gpack": { let n = 0; PACKS[b.dataset.p].forEach(([nm,c]) => { if (addGear(s,nm,c)) n++; }); touch(ui.id); render(); toast(n ? `${n} éléments ajoutés` : "Déjà tout dans le sac"); break; }
    case "greset": s.gear.forEach(x => { x[ui.gearMode==="depart"?"packed":"back"] = false; }); touch(ui.id); render(); break;
    case "gcopy": {
      const txt = `${s.title} · ${longDate(s.date)}\n` + CATS.map(c => { const it = s.gear.filter(x=>x.cat===c); return it.length ? `\n${c}\n` + it.map(x=>`${x.packed?"☑":"☐"} ${x.name}`).join("\n") : ""; }).join("");
      try { await navigator.clipboard.writeText(txt); toast("Liste copiée"); } catch(err){ toast("Copie impossible sur cet appareil"); }
      break; }
    case "pal": s.palette = b.dataset.v; touch(ui.id); render(); break;
    case "board": ui.board = b.dataset.v === "1"; render(); break;
    case "padd": addPlan(s,{}); touch(ui.id); ui.board = false; render(); setTimeout(()=>{ const el = $(`#pdesc-${s.plans[s.plans.length-1].id}`); if (el){ el.focus(); el.scrollIntoView({block:"center"}); } },0); break;
    case "pdel": s.plans = s.plans.filter(p=>p.id!==b.dataset.pid); touch(ui.id); render(); break;
    case "pdup": { const i = s.plans.findIndex(p=>p.id===b.dataset.pid); const cp = {...s.plans[i], id:uid(), done:false}; s.plans.splice(i+1,0,cp); touch(ui.id); render(); break; }
    case "pup": case "pdown": { const i = s.plans.findIndex(p=>p.id===b.dataset.pid); const j = a==="pup"?i-1:i+1; if (j<0||j>=s.plans.length) break; [s.plans[i],s.plans[j]] = [s.plans[j],s.plans[i]]; touch(ui.id); render(); break; }
    case "idea": { const x = (SUGGEST[s.category]||SUGGEST.autre).find(x=>x[0]===b.dataset.i); if (x){ addPlan(s,{desc:x[0],cadrage:x[1],angle:x[2],mouv:x[3]}); touch(ui.id); render(); toast("Plan ajouté au storyboard"); } break; }
    case "ideas-all": { (SUGGEST[s.category]||SUGGEST.autre).filter(x=>!s.plans.some(p=>p.desc===x[0])).forEach(x=>addPlan(s,{desc:x[0],cadrage:x[1],angle:x[2],mouv:x[3]})); touch(ui.id); render(); toast("Plans ajoutés"); break; }
    case "ai": askClaude(s); break;
    case "ai-add": { const p = ui.ai.plans[+b.dataset.i]; if (p && !p._added){ addPlan(s,p); p._added = true; touch(ui.id); render(); toast("Plan ajouté"); } break; }
    case "ai-all": { ui.ai.plans.forEach(p => { if (!p._added){ addPlan(s,p); p._added = true; } }); touch(ui.id); render(); toast("Plans ajoutés"); break; }
    case "kadd": { const n = $("#k-name").value, c = $("#k-cat").value; if (addKit(n,c)){ touchKit(); render(); setTimeout(()=>$("#k-name")&&$("#k-name").focus(),0); } else toast(n.trim()?"Déjà dans la bibliothèque":"Écrivez le nom du matériel"); break; }
    case "kdel": S.kit.items = S.kit.items.filter(k=>k.id!==b.dataset.kid); touchKit(); render(); break;
    case "kstarter": STARTER.forEach(([n,c])=>addKit(n,c)); touchKit(); render(); toast("Liste type ajoutée : renommez ou supprimez à votre guise"); break;
    case "fps": ui.tool.fps = +b.dataset.v; render(); break;
    case "menu": ui.menu = true; render(); break;
    case "plus": ui.plus = "main"; render(); break;
    case "pclose": ui.plus = null; render(); break;
    case "pstep2": ui.plus = "pay"; render(); break;
    case "pnew": ui.plus = null; newShoot(); break;
    case "ppay": ui.plus = null; openShoot(b.dataset.id, "pay"); setTimeout(()=>{ const el = $("#pay-amt"); if (el){ el.scrollIntoView({block:"center"}); el.focus(); } }, 50); break;
    case "mclose": ui.menu = false; render(); break;
    case "dnnew": ui.destForm = {pays:"FR"}; render(); setTimeout(() => { const e = $("#dn-ville"); if (e) e.focus(); }, 30); break;
    case "dncancel": ui.destForm = null; render(); break;
    case "dnsave": { const ville = $("#dn-ville").value.trim(); if (!ville){ toast("Indiquez la ville"); break; } const pays = $("#dn-pays").value; const c = COUNTRIES.find(x => x[0] === pays) || ["","",0,0]; const id = uid();
      S.dest = S.dest || []; const d = {ville, pays, paysNom:c[1], lat:c[2], lon:c[3], an:$("#dn-an").value.trim(), created:Date.now(), count:0, videos:[]}; S.dest.push({id, ...d});
      destSave(id, d); ui.destForm = null; pushHist(); ui.destId = id; render(true); toast(`${ville} ajoutée · ajoutez maintenant vos photos`); break; }
    case "dopen": pushHist(); ui.destId = b.dataset.id; ui.dDel = false; render(true); break;
    case "dback": ui.destId = null; ui.dDel = false; render(true); break;
    case "dcover": { const d = (S.dest||[]).find(x => x.id === ui.destId); const x = (S.destPhotos[ui.destId]||[]).find(p => p.id === b.dataset.pid); if (!d || !x) break; toast("Couverture en cours…"); photoData(dataURLToBlob(x.img), 720).then(cov => destSave(d.id, {cover:cov, coverId:x.id})).then(() => toast("Couverture changée")); break; }
    case "dpdel": { const pid = b.dataset.pid; if (ui.dpDel !== pid){ ui.dpDel = pid; render(); break; } ui.dpDel = null; const d = (S.dest||[]).find(x => x.id === ui.destId); if (!d) break;
      window.__apocaDest.delPhoto(d.id, pid).then(() => { const left = (S.destPhotos[d.id]||[]).filter(p => p.id !== pid); const patch = {count: left.length + (d.videos||[]).length}; if (d.coverId === pid){ patch.coverId = ""; patch.cover = ""; } destSave(d.id, patch); if (d.coverId === pid && left[0]) photoData(dataURLToBlob(left[0].img), 720).then(cov => destSave(d.id, {cover:cov, coverId:left[0].id})); }); toast("Photo supprimée"); break; }
    case "dvadd": { const u = ($("#dv-url").value||"").trim(); if (!/^https?:\/\//.test(u)){ toast("Collez un lien qui commence par https://"); break; } const d = (S.dest||[]).find(x => x.id === ui.destId); if (!d) break; const videos = [...(d.videos||[]), {id:uid(), url:u}]; d.videos = videos; destSave(d.id, {videos, count:(S.destPhotos[d.id]||[]).length + videos.length}); render(); toast("Vidéo ajoutée"); break; }
    case "dvdel": { const d = (S.dest||[]).find(x => x.id === ui.destId); if (!d) break; const videos = (d.videos||[]).filter(v => v.id !== b.dataset.vid); d.videos = videos; destSave(d.id, {videos, count:(S.destPhotos[d.id]||[]).length + videos.length}); render(); break; }
    case "ddel": { if (!ui.dDel){ ui.dDel = true; render(); break; } const id = ui.destId; ui.dDel = false; ui.destId = null; S.dest = (S.dest||[]).filter(x => x.id !== id); window.__apocaDest.delDest(id).then(() => toast("Destination supprimée")).catch(() => toast("Suppression impossible pour le moment")); render(true); break; }
    case "rqtab": ui.rqTab = b.dataset.v; render(); break;
    case "rqdevis": devisFromRequest(b.dataset.id); break;
    case "qsend": pushHist(); ui.view = "send"; render(true); break;
    case "sendfull": pushHist(); ui.view = "quote"; ui.qprev = false; render(true); break;
    case "sendgo": sendGo(); break;
    case "sendcopy": { const v = (ui.sendSt && ui.sendSt.link) || ""; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Lien copié"), () => toast(v)); break; }
    case "mailsave": mailSave(); break;
    case "mailedit": ui.mailEdit = true; render(); break;
    case "rqarch": rqSet(b.dataset.id, {status:"Archivée"}); toast("Demande archivée"); break;
    case "rqunarch": rqSet(b.dataset.id, {status:"Lue"}); break;
    case "rqdel": { const id = b.dataset.id; if (ui.rqDel !== id){ ui.rqDel = id; render(); break; } ui.rqDel = null; delete S.requests[id]; if (S.db) S.db.doc("requests/" + id).delete().catch(e => toast(errMsg(e))); render(); toast("Demande supprimée"); break; }
    case "rqshoot": { const r = S.requests[b.dataset.id]; if (!r) break; const id = uid();
      S.shoots[id] = {kind:"shoot", title:`${r.type||"Tournage"} · ${r.nom||""}`.trim(), client:r.nom||"", category:RQ_CAT[String(r.type||"").split(" · ")[0]]||"autre", type:/^(Photo|Shooting photo)/.test(r.type||"")?"Photo":"Vidéo", status:"À confirmer", date:r.date||todayStr(), time:"09:00", city:r.lieu||"", place:r.lieu||"", contact:r.tel||r.email||"", notes:[r.message, r.email?"E-mail : "+r.email:""].filter(Boolean).join("\n"), ratio:"16:9", palette:"docu", created:Date.now(), prep:{}, gear:[], plans:[], fromRequest:b.dataset.id};
      touch(id); rqSet(b.dataset.id, {status:"Tournage créé", shootId:id}); openShoot(id, "infos"); toast("Tournage créé à partir de la demande"); break; }
    case "go": ui.menu = false; if (ui.view !== b.dataset.v){ pushHist(); ui.view = b.dataset.v; } render(true); break;
    case "mhome": ui.menu = false; if (ui.view !== "home"){ pushHist(); ui.view = "home"; } ui.homeEdit = true; render(true); break;
    case "qnew": newQuote(); break;
    case "inew": newQuote(null, null, "invoice"); break;
    case "q2inv": { const q = S.quotes[ui.qid]; const id = uid(); const c = JSON.parse(JSON.stringify(q)); Object.assign(c, {kind:"invoice", num:nextQuoteNum("invoice"), date:todayStr(), validity:15, deposit:0, paid:"", quoteId:ui.qid, notes:"Merci pour votre confiance.", created:Date.now()}); delete c.status; S.quotes[id] = c; touchQ(id); if (q.status !== "Accepté"){ q.status = "Accepté"; touchQ(ui.qid); } pushHist(); ui.view = "quote"; ui.qid = id; ui.qprev = false; render(true); toast("Facture créée à partir du devis"); break; }
    case "qfromshoot": newQuote(s, ui.id); break;
    case "qopen": pushHist(); ui.view = "quote"; ui.qid = b.dataset.id; ui.qprev = false; ui.qdel = false; render(true); break;
    case "qprev": ui.qprev = b.dataset.v === "1"; render(true); break;
    case "qladd": { const q = S.quotes[ui.qid]; q.lines.push({id:uid(), desc:"", qty:1, unit:""}); touchQ(ui.qid); render(); setTimeout(()=>{ const el = $(`#ql-d-${q.lines[q.lines.length-1].id}`); if (el) el.focus(); },0); break; }
    case "qlpreset": { const q = S.quotes[ui.qid]; const empty = q.lines.find(l => !l.desc && !+l.unit); if (empty) empty.desc = b.dataset.v; else q.lines.push({id:uid(), desc:b.dataset.v, qty:1, unit:""}); touchQ(ui.qid); render(); toast("Ligne ajoutée : indiquez le prix"); break; }
    case "qldel": { const q = S.quotes[ui.qid]; q.lines = q.lines.filter(l=>l.id!==b.dataset.lid); touchQ(ui.qid); render(); break; }
    case "qpdf": if (!ui.pdfBusy) downloadPDF(S.quotes[ui.qid]); break;
    case "qdup": { const q = S.quotes[ui.qid]; const id = uid(); S.quotes[id] = {...JSON.parse(JSON.stringify(q)), num:nextQuoteNum(q.kind), date:todayStr(), status:"Brouillon", cancelled:false, created:Date.now()}; touchQ(id); pushHist(); ui.qid = id; ui.qprev = false; render(true); toast("Copie créée"); break; }
    case "qdel": ui.qdel = true; render(); break;
    case "qdel-no": ui.qdel = false; render(); break;
    case "qdel-yes": { const id = ui.qid; const wasInv = isInv(S.quotes[id]); delete S.quotes[id]; qDirty.delete(id); if (S.mode === "local") saveLocal(); else { try { await S.db.doc("quotes/" + id).delete(); } catch(e){ toast(errMsg(e)); } } ui.view = wasInv ? "invoices" : "quotes"; ui.qid = null; ui.qdel = false; render(true); toast("Supprimé"); break; }
    case "qtoshoot": { const q = S.quotes[ui.qid]; const sh = S.shoots[q.shootId]; if (sh){ sh.price = Math.round(qTotals(q).ttc*100)/100; if (q.client && q.client.name && !sh.client) sh.client = q.client.name; touch(q.shootId); toast(`Prix du tournage : ${money(sh.price)}`); } break; }
    case "tltpl": { const tpl = TIMELINES[s.category] || TIMELINES.autre; s.timeline = tpl.map(([t,l,n]) => ({id:uid(), time:t, label:l, note:n||""})); touch(ui.id); render(); toast("Déroulé type ajouté : ajustez les heures"); break; }
    case "tladd": { const t = $("#tl-new-t").value, l = $("#tl-new-l").value.trim(); if (!l){ toast("Écrivez le moment à ajouter"); break; } s.timeline = s.timeline || []; s.timeline.push({id:uid(), time:t, label:l, note:""}); touch(ui.id); render(); setTimeout(()=>$("#tl-new-l")&&$("#tl-new-l").focus(),0); break; }
    case "tldel": s.timeline = (s.timeline||[]).filter(x=>x.id!==b.dataset.tid); touch(ui.id); render(); break;
    case "tlgold": { const g = goldenFor(s); if (g){ s.timeline = s.timeline || []; s.timeline.push({id:uid(), time:g.start, label:"Heure dorée · séance portraits", note:`Lumière idéale jusqu'à ${g.end}`, gold:true}); touch(ui.id); render(); } break; }
    case "tlcopy": { const tl = [...(s.timeline||[])].sort((a,b)=>(a.time||"").localeCompare(b.time||"")); const txt = `${s.title} · ${longDate(s.date)}\n` + tl.map(x=>`${x.time}  ${x.label}${x.note?" ("+x.note+")":""}`).join("\n"); try { await navigator.clipboard.writeText(txt); toast("Déroulé copié"); } catch(e){ toast("Copie impossible sur cet appareil"); } break; }
    case "mopen": ui.lightbox = b.dataset.mid; render(); break;
    case "mclose2": ui.lightbox = null; render(); break;
    case "mprev": case "mnext": { const m = s.mood||[]; const i = m.findIndex(x=>x.id===ui.lightbox); const j = (i + (a==="mnext"?1:-1) + m.length) % m.length; ui.lightbox = m[j] && m[j].id; render(); break; }
    case "mdel": { const it = (s.mood||[]).find(x=>x.id===b.dataset.mid); s.mood = (s.mood||[]).filter(x=>x.id!==b.dataset.mid); ui.lightbox = null; touch(ui.id); render(); if (it && it.assetId && S.assets){ try { await S.assets.delete(it.assetId); } catch(e){} } toast("Image supprimée"); break; }
    case "postdl": { s.post = s.post || {steps:{}}; s.post.deadline = addDays(s.date || todayStr(), (+b.dataset.v)*7); touch(ui.id); render(); break; }
    case "postcopy": try { await navigator.clipboard.writeText(s.post.link); toast("Lien copié"); } catch(e){ toast("Copie impossible sur cet appareil"); } break;
    case "openpost": openShoot(b.dataset.id, "post"); break;
    case "pradd": { const n = $("#pr-name").value.trim(); if (!n){ toast("Écrivez le nom de la prestation"); break; } const pv = $("#pr-price").value; S.prices.items.push({id:uid(), name:n, price: pv===""?"":+pv, unit:$("#pr-unit").value}); touchPr(); render(); toast("Tarif ajouté"); break; }
    case "prdel": S.prices.items = S.prices.items.filter(x=>x.id!==b.dataset.pid); touchPr(); render(); break;
    case "prstarter": QPRESETS.forEach(n => { if (!S.prices.items.some(x=>x.name===n)) S.prices.items.push({id:uid(), name:n, price:"", unit: /heure/.test(n)?"heure":/demi/.test(n)?"demi":/journée/.test(n)?"jour":"forfait"}); }); touchPr(); render(); toast("Liste ajoutée : indiquez vos prix"); break;
    case "qlprice": { const q = S.quotes[ui.qid]; const p = S.prices.items.find(x=>x.id===b.dataset.v); if (!p) break; const empty = q.lines.find(l => !l.desc && !+l.unit); const line = {desc:p.name + (["heure","piece","km"].includes(p.unit) ? ` (${unitLabel(p.unit)})` : ""), qty:1, unit:p.price}; if (empty) Object.assign(empty, line); else q.lines.push({id:uid(), ...line}); touchQ(ui.qid); render(); break; }
    case "tmadd": { const n = $("#tm-name").value.trim(); if (!n){ toast("Écrivez le nom de la personne"); break; } S.team.members.push({id:uid(), name:n, role:$("#tm-role").value.trim(), phone:$("#tm-phone").value.trim()}); touchTm(); render(); toast("Ajouté à l'équipe"); break; }
    case "tmdel": S.team.members = S.team.members.filter(m=>m.id!==b.dataset.v); touchTm(); render(); break;
    case "memopen": ui.mem = ui.mem === b.dataset.v ? null : b.dataset.v; render(); break;
    case "crewadd": s.crew = s.crew || []; s.crew.push({id:uid(), mid:b.dataset.v, fee:"", paid:false}); touch(ui.id); render(); break;
    case "crewdel": s.crew = (s.crew||[]).filter(c=>c.id!==b.dataset.cid); touch(ui.id); render(); break;
    case "syear": ui.statsYear = +b.dataset.v; render(); break;
    case "openct": pushHist(); ui.view = "contract"; ui.id = b.dataset.id; ui.qprev = false; render(true); break;
    case "ctpdf": if (!ui.pdfBusy) downloadContract(cur()); break;
    case "ctgo": openShoot(ui.id, "infos"); break;
    case "hedit": ui.homeEdit = true; render(); break;
    case "hclose": ui.homeEdit = false; render(); break;
    case "hfit": S.home.fit = b.dataset.v; saveHome(); render(); break;
    case "hpos": S.home.pos = b.dataset.v; saveHome(); render(); break;
    case "hremove": { const old = S.home.id; S.home.url = ""; S.home.id = ""; await saveHome(); if (old && S.assets){ try { await S.assets.delete(old); } catch(e){} } render(); break; }
    case "cli": ui.cli = ui.cli === b.dataset.v ? null : b.dataset.v; render(); break;
    case "openpay": openShoot(b.dataset.id, "pay"); break;
    case "payfill": { const t = +s.price||0; const r = restOf(s); const v = b.dataset.v === "rest" ? r : Math.round(t * (+b.dataset.v) / 100 * 100) / 100; $("#pay-amt").value = Math.max(0, v); if (b.dataset.v !== "rest") $("#pay-note").value = b.dataset.v === "30" ? "Acompte" : "Moitié"; else $("#pay-note").value = "Solde"; break; }
    case "payadd": { const amt = parseFloat(String($("#pay-amt").value).replace(",", ".")); if (!(amt > 0)){ toast("Indiquez le montant reçu"); break; } s.payments = s.payments || []; s.payments.push({id:uid(), amount:Math.round(amt*100)/100, date:$("#pay-date").value || todayStr(), method:$("#pay-meth").value, note:$("#pay-note").value.trim()}); touch(ui.id); render(); toast(`${money(amt)} noté · reste ${money(Math.max(0,restOf(s)))}`); break; }
    case "alertnext": pushHist(); ui.view = "notif"; render(true); break;
    case "sbgo": { ui.menu = false; ui.plus = null; if (ui.view === "shoot" && cur()){ ui.tab = "days"; render(true); break; } const all = sorted(); const nx = all.find(x => (x.date||"9999") >= todayStr()) || all[all.length-1]; if (nx) openShoot(nx.id, "days"); else { if (ui.view !== "agenda"){ pushHist(); ui.view = "agenda"; } render(true); toast("Créez d'abord un tournage : les Shoot Days se trouvent dans chaque tournage"); } break; }
    case "sbsel": ui.sbSel = ui.sbSel === b.dataset.sc ? null : b.dataset.sc; render(); break;
    case "sbday": if (ui.sbSel) sbMove(s, ui.sbSel, "day", +b.dataset.i); else if (stripOf(s).scenes.length) toast("Touchez d'abord une scène à placer"); break;
    case "sbpool": if (ui.sbSel) sbMove(s, ui.sbSel, "pool"); break;
    case "sbtobone": if (ui.sbSel){ ui.sbBone = true; sbMove(s, ui.sbSel, "bone"); } break;
    case "sbcancel": ui.sbSel = null; render(); break;

/* ---------- Pull to refresh (elastic, no reload) ---------- */
(function(){
  const ptr = document.getElementById("ptr");
  const MAX = 130, TRIGGER = 72, HOLD = 58;
  const SPRING = "transform .6s cubic-bezier(.18,1.45,.38,1)", EASE = "transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s";
  let y0 = null, x0 = 0, dy = 0, active = false, raf = 0, target = null, busy = false;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const band = d => MAX * (1 - 1 / (d * 0.55 / MAX + 1));   // rubber band: resists more the further you pull
  const tgt = () => document.querySelector("main") || document.querySelector(".home");
  function paint(pull){
    if (target && !reduce) target.style.transform = `translate3d(0,${pull}px,0)`;
    ptr.style.opacity = Math.min(1, pull / 50);
    ptr.style.transform = `translate3d(0,${pull - 52}px,0) rotate(${Math.min(180, pull / TRIGGER * 180)}deg)`;
  }
  function settle(){
    if (target){ target.style.transition = reduce ? "" : SPRING; target.style.transform = "translate3d(0,0,0)"; }
    ptr.style.transition = EASE; ptr.style.opacity = 0; ptr.style.transform = "translate3d(0,-60px,0)";
    const t = target; setTimeout(() => { if (t){ t.style.transition = ""; t.style.transform = ""; t.style.willChange = ""; } ptr.classList.remove("go"); }, 650);
  }
  document.addEventListener("touchstart", e => {
    if (busy || ui.menu || ui.plus || ui.lightbox || ui.homeEdit || window.scrollY > 0 || e.touches.length !== 1){ y0 = null; return; }
    const t = e.target; if (t.closest && t.closest("input,textarea,select,.pals,.seg,.paperwrap,.hset")){ y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; active = false;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const ny = e.touches[0].clientY - y0, nx = e.touches[0].clientX - x0;
    if (!active){
      if (ny > 6 && Math.abs(nx) < ny && window.scrollY <= 0){ active = true; target = tgt(); if (target){ target.style.transition = ""; target.style.willChange = "transform"; } ptr.style.transition = ""; }
      else if (ny < 0 || Math.abs(nx) > 12){ y0 = null; return; } else return;
    }
    dy = Math.max(0, ny);
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(band(dy)); });
  }, {passive:true});
  async function end(){
    if (y0 === null || !active){ y0 = null; return; }
    y0 = null; active = false; cancelAnimationFrame(raf); raf = 0;
    if (band(dy) >= TRIGGER){
      busy = true;
      if (target){ target.style.transition = reduce ? "" : "transform .35s cubic-bezier(.2,.9,.3,1.15)"; if (!reduce) target.style.transform = `translate3d(0,${HOLD}px,0)`; }
      ptr.style.transition = "transform .35s cubic-bezier(.2,.9,.3,1.15)"; ptr.style.transform = `translate3d(0,${HOLD - 46}px,0)`; ptr.classList.add("go");
      const t0 = Date.now();
      try { await flush(); } catch(e){}
      await new Promise(r => setTimeout(r, Math.max(0, 750 - (Date.now() - t0))));
      const keep = target; render(); target = tgt();
      if (target && keep !== target && !reduce){ target.style.transform = `translate3d(0,${HOLD}px,0)`; target.offsetHeight; }
      settle(); busy = false; toast("À jour");
    } else settle();
  }
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", () => { if (active){ dy = 0; } end(); });
})();

    let gotShoots = false, gotKit = false;
    const done = () => { if (gotShoots && gotKit && !S.ready){ S.ready = true; render(); } };
    db.collection("shoots").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { next[d.id] = dirty.has(d.id) && S.shoots[d.id] ? S.shoots[d.id] : d.data(); });
      for (const id of dirty) if (S.shoots[id] && !next[id]) next[id] = S.shoots[id];
      S.shoots = JSON.parse(JSON.stringify(next));
      gotShoots = true; if (S.ready) softRender(); else done();
    }, () => { S.mode = "local"; loadLocal(); S.ready = true; render(); });
    db.doc("kit/library").onSnapshot(d => {
      if (!kitDirty) S.kit = d.exists ? JSON.parse(JSON.stringify(d.data())) : {items:[]};
      if (!Array.isArray(S.kit.items)) S.kit.items = [];
      gotKit = true; if (S.ready) softRender(); else done();
    }, () => {});
    db.collection("quotes").onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { next[d.id] = qDirty.has(d.id) && S.quotes[d.id] ? S.quotes[d.id] : d.data(); });
      for (const id of qDirty) if (S.quotes[id] && !next[id]) next[id] = S.quotes[id];
      S.quotes = JSON.parse(JSON.stringify(next)); if (S.ready) softRender(); tryPendingDevis();
    }, () => {});
    db.doc("meta/pushStatus").onSnapshot(d => { S.pushStatus = d.exists ? d.data() : null; if (ui.view === "notif") softRender(); }, () => {});
    db.collection("rdv").onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); }); S.rdv = JSON.parse(JSON.stringify(next)); if (S.ready && !isEditing()) softRender(); }, () => {});
    db.collection("requests").onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); }); S.requests = JSON.parse(JSON.stringify(next)); if (S.ready) softRender(); tryPendingDevis(); }, () => {});
    if (window.__apocaDevis) window.__apocaDevis.watchMail(m => { S.mailCfg = m; if (ui.view === "send") softRender(); });
    setTimeout(tryPendingDevis, 1500); setTimeout(tryPendingDevis, 5000); setTimeout(tryPendingDevis, 9000);
    db.doc("settings/prices").onSnapshot(d => { if (!prDirty){ S.prices = d.exists ? JSON.parse(JSON.stringify(d.data())) : {items:[]}; if (!Array.isArray(S.prices.items)) S.prices.items = []; if (S.ready) softRender(); } }, () => {});
    db.doc("settings/team").onSnapshot(d => { if (!tmDirty){ S.team = d.exists ? JSON.parse(JSON.stringify(d.data())) : {members:[]}; if (!Array.isArray(S.team.members)) S.team.members = []; if (S.ready) softRender(); } }, () => {});
    db.doc("settings/company").onSnapshot(d => { if (d.exists && !coDirty){ S.company = {...S.company, ...JSON.parse(JSON.stringify(d.data()))}; if (S.ready) softRender(); } }, () => {});
    db.doc("settings/home").onSnapshot(d => { const localUrl = S.home.url; if (d.exists){ S.home = {...S.home, ...JSON.parse(JSON.stringify(d.data()))}; } if (!S.home.url && /^data:image\//.test(localUrl||"") && localUrl.length < 900000){ S.home.url = localUrl; S.home.id = ""; saveHome(); } if (ui.view === "home" && !ui.uploading) softRender(); }, () => {});
    setTimeout(() => { if (!S.ready){ S.ready = true; render(); } }, 8000);
  }
  if (use){ try { S.assets = await window.claude.use("assets"); } catch(e){ S.assets = null; } }
  if (use){ try { S.downloads = await window.claude.use("downloads"); } catch(e){ S.downloads = null; } }
  if (use){ try { S.sample = await window.claude.use("sample"); if (S.ready && ui.view==="shoot" && ui.tab==="plans") softRender(); } catch(e){ S.sample = null; } }
})();
})();
</script>
