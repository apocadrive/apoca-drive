name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer les notifications (functions)
        run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: Envoyer sur Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "::notice::Mise en ligne automatique pas encore activée (secret FIREBASE_TOKEN absent). Rien n'a été envoyé."; exit 0; fi
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only hosting,firestore:rules,functions --project apoca-drive --non-interactive --force 2>&1 | tee deploy.log; then
            grep -iE "error|denied|invalid|failed" deploy.log | head -5 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "::notice::Mise en ligne réussie"
